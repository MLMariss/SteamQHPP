name: 4.3 Freshness check -> FRESHNESS.md

on:
  workflow_dispatch:          # run manually any time
  schedule:
    # Once daily at 07:00 UTC — the morning oversight pass. Deliberately placed AFTER
    # 4.1 shard-health (06:35) and after the 06:00 scrape slot has had an hour to land
    # its games.json + trailing COVERAGE.md, so the snapshot reads a settled tree rather
    # than one mid-commit. Read-only w.r.t. every external service (it only scans local
    # files and the workflow crons), so it costs no storefront budget.
    - cron: "0 7 * * *"

permissions:
  contents: write             # commits FRESHNESS.md

concurrency:
  group: freshness-md         # one-writer-per-file (FRESHNESS.md); can't clobber the data jobs
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20       # reads games.json + every shard set; ~1-2 min in practice
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # freshness.py imports coverage.py for its cooldown constants and bucketers;
      # both are standard-library only, so there is no pip install step.

      - name: Generate FRESHNESS.md
        run: python freshness.py

      - name: Commit FRESHNESS.md
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FRESHNESS.md
          if git diff --staged --quiet; then
            echo "FRESHNESS.md unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "freshness: refresh FRESHNESS.md"
          # FRESHNESS.md is single-writer, so a rebase onto main never conflicts on it; we
          # still abort any half-finished rebase (never wedge) and FAIL LOUD if the push
          # can't land after retries — no silent green runs.
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "pushed"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "ERROR: could not push FRESHNESS.md after 5 attempts"; exit 1
